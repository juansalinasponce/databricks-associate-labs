resources:
  jobs:
    eval2_job:
      name: JOB_EVAL2_SEGUROS

      queue:
        enabled: true

      parameters:
        - name: catalog
          default: ${var.catalog}

        - name: volume_base
          default: ${var.volume_base}

      tasks:
        - task_key: 01_bronze
          notebook_task:
            notebook_path: ../src/01_bronze_eval2.py

        - task_key: 02_silver_merge
          depends_on:
            - task_key: 01_bronze
          max_retries: 1
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: ../src/02_silver_eval2.py

        - task_key: 03_gold_pipeline
          depends_on:
            - task_key: 02_silver_merge
          pipeline_task:
            pipeline_id: ${resources.pipelines.eval2_gold.id}
            full_refresh: false

        - task_key: 04_validacion
          depends_on:
            - task_key: 03_gold_pipeline
          notebook_task:
            notebook_path: ../src/04_validacion_eval2.py
